name: weather

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    environment: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build backend image
      - name: Build backend image
        run: docker build ./backend -t backend-ci:latest

      # Build frontend image
      - name: Build frontend image
        run: docker build ./frontend -t frontend-ci:latest

      # Run backend container
      - name: Run backend
        run: docker run -d -p 3000:3000 --name backend-ci backend-ci:latest

      # Run frontend container
      - name: Run frontend
        run: docker run -d -p 4173:4173 --name frontend-ci frontend-ci:latest

      # Wait for backend/frontend to be ready
      - name: Wait for services
        run: |
          echo "Waiting for backend..."
          until curl -s http://localhost:3000/health; do sleep 1; done
          echo "Waiting for frontend..."
          until curl -s http://localhost:4173; do sleep 1; done

      # Playwright install
      - run: npm install
      - run: npx playwright install --with-deps

      # Run e2e tests
      - name: E2E tests
        run: npx playwright test
