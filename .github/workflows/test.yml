name: weather

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    environment: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Start containers in detached mode
      - name: Start backend
        run: docker compose up
        working-directory: ./backend

      - name: Start frontend
        run: docker compose up
        working-directory: ./frontend

      # Playwright install
      - run: npm install
      - run: npx playwright install --with-deps

      # Run tests
      - name: E2E tests
        run: npx playwright test
          docker stop backend-ci frontend-ci || true
          docker rm backend-ci frontend-ci || true
